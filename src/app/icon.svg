<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 만화풍 덩크: 붉은 바탕, 굵은 먹선, 내리꽂히는 공과 림 -->
  <rect width="64" height="64" rx="13" fill="#d81f26"/>
  <!-- 집중선 -->
  <g stroke="#fff" stroke-linecap="round" opacity="0.9">
    <path d="M6 7l11 9" stroke-width="2.4"/>
    <path d="M4 20l9 4" stroke-width="1.8"/>
    <path d="M20 4l5 8" stroke-width="1.8"/>
    <path d="M58 7L47 16" stroke-width="2.4"/>
    <path d="M60 20l-9 4" stroke-width="1.8"/>
    <path d="M44 4l-5 8" stroke-width="1.8"/>
  </g>
  <!-- 그물 -->
  <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 42l5 17h20l5-17"/>
    <path d="M25 43l3 16M32 43v16M39 43l-3 16M19.5 50h25M21.5 56h21"/>
  </g>
  <!-- 림 뒤쪽 (공에 가려진다) -->
  <path d="M15 42a17 4.5 0 0 1 34 0" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <path d="M15 42a17 4.5 0 0 1 34 0" fill="none" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>
  <!-- 공: 림 안으로 반쯤 들어간 순간 -->
  <circle cx="32" cy="27" r="15" fill="#f58220" stroke="#111" stroke-width="3"/>
  <g fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round">
    <path d="M17.5 24.5c9 4 20 4 29 0"/>
    <path d="M32 12v30"/>
    <path d="M22 15.5c5 6 5 17 1 23M42 15.5c-5 6-5 17-1 23"/>
  </g>
  <!-- 림 앞쪽 (공을 가린다) -->
  <path d="M15 42a17 4.5 0 0 0 34 0" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <path d="M15 42a17 4.5 0 0 0 34 0" fill="none" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>
</svg>
